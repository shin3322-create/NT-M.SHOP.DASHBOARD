<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>National Motors AS DashBoard · 로그인</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap">
<style>
  :root{
    color-scheme: light;
    --bg:#f9f9f7; --surface:#ffffff; --surface-2:#f3f2ee;
    --text-primary:#16181c; --text-secondary:#52514e; --text-muted:#898781;
    --border:rgba(11,11,11,0.10); --accent:#14335c; --accent-ink:#ffffff;
    --critical:#d03b3b; --critical-bg:rgba(208,59,59,0.10);
    --good:#0ca30c; --good-bg:rgba(12,163,12,0.12);
    --shadow:0 1px 2px rgba(11,11,11,.06),0 6px 20px rgba(11,11,11,.05);
    --font:"Noto Sans KR",-apple-system,BlinkMacSystemFont,"Malgun Gothic",sans-serif;
  }
  @media (prefers-color-scheme: dark){
    :root{
      color-scheme: dark;
      --bg:#0d0d0d; --surface:#1a1a19; --surface-2:#232320;
      --text-primary:#f5f5f3; --text-secondary:#c3c2b7; --text-muted:#93918a;
      --border:rgba(255,255,255,0.10); --accent:#3987e5; --accent-ink:#06131f;
      --critical:#e66767; --critical-bg:rgba(230,103,103,0.14);
      --good:#23c623; --good-bg:rgba(35,198,35,0.15);
      --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35);
    }
  }
  *{box-sizing:border-box;}
  html,body{margin:0;height:100%;}
  body{
    background:var(--bg); color:var(--text-primary); font-family:var(--font);
    display:flex; align-items:center; justify-content:center; padding:16px;
  }
  .card{ width:100%; max-width:380px; background:var(--surface); border:1px solid var(--border);
         border-radius:16px; box-shadow:var(--shadow); padding:28px 26px; }
  .eyebrow{ font-size:11px; letter-spacing:.08em; text-transform:uppercase; color:var(--text-muted); font-weight:700; }
  h1{ font-size:20px; font-weight:900; margin:2px 0 4px; }
  .sub{ font-size:12.5px; color:var(--text-secondary); margin-bottom:20px; }
  .field{ display:flex; flex-direction:column; gap:5px; margin-bottom:12px; }
  .field label{ font-size:11.5px; font-weight:700; color:var(--text-secondary); }
  .field input{ padding:10px 11px; border-radius:9px; border:1px solid var(--border);
                background:var(--surface); color:var(--text-primary); font-size:14px; font-family:inherit; }
  .btn{ width:100%; border:none; border-radius:9px; padding:11px 16px; font-size:14px; font-weight:700;
        cursor:pointer; background:var(--accent); color:var(--accent-ink); margin-top:6px; }
  .btn:disabled{ opacity:.6; cursor:not-allowed; }
  .btn.ghost{ background:transparent; color:var(--accent); border:1px solid var(--border); margin-top:8px; }
  .msg{ font-size:12.5px; border-radius:9px; padding:9px 11px; margin-bottom:12px; display:none; }
  .msg.error{ display:block; background:var(--critical-bg); color:var(--critical); }
  .msg.ok{ display:block; background:var(--good-bg); color:var(--good); }
  .switch{ text-align:center; font-size:12.5px; color:var(--text-muted); margin-top:16px; }
  .switch a{ color:var(--accent); font-weight:700; cursor:pointer; text-decoration:none; }
  .email-group{ display:flex; align-items:stretch; border:1px solid var(--border); border-radius:9px; overflow:hidden; background:var(--surface); }
  .email-group input{ flex:1; min-width:0; border:none; border-radius:0; padding:10px 11px; font-size:14px;
                       font-family:inherit; background:transparent; color:var(--text-primary); }
  .email-group input:focus{ outline:none; }
  .email-group .email-suffix{ display:flex; align-items:center; padding:0 10px; background:var(--surface-2);
                               color:var(--text-muted); font-size:13px; white-space:nowrap; border-left:1px solid var(--border); }
</style>
</head>
<body>
  <div class="card">
    <div class="eyebrow">National Motors BMW · 군산 · 목포 · 서산</div>
    <h1>AS DashBoard</h1>
    <div class="sub">직원 계정으로 로그인하세요</div>

    <div id="msg" class="msg"></div>

    <form id="login-form">
      <div class="field"><label for="login-email">이메일</label>
        <div class="email-group">
          <input id="login-email" type="text" autocomplete="username" required placeholder="이름 또는 아이디">
          <span class="email-suffix">@nationalmotors.co.kr</span>
        </div>
      </div>
      <div class="field"><label for="login-password">비밀번호</label><input id="login-password" type="password" autocomplete="current-password" required></div>
      <button class="btn" id="login-btn" type="submit">로그인</button>
    </form>

    <form id="signup-form" hidden>
      <div class="field"><label for="signup-name">이름</label><input id="signup-name" type="text" required></div>
      <div class="field"><label for="signup-email">이메일</label>
        <div class="email-group">
          <input id="signup-email" type="text" autocomplete="username" required placeholder="이름 또는 아이디">
          <span class="email-suffix">@nationalmotors.co.kr</span>
        </div>
      </div>
      <div class="field"><label for="signup-password">비밀번호 (6자 이상)</label><input id="signup-password" type="password" autocomplete="new-password" minlength="6" required></div>
      <button class="btn" id="signup-btn" type="submit">가입 신청</button>
    </form>

    <div class="switch">
      <span id="to-signup">계정이 없으신가요? <a>가입 신청</a></span>
      <span id="to-login" hidden>이미 계정이 있으신가요? <a>로그인</a></span>
    </div>
  </div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.116.0/dist/umd/supabase.js"></script>
<script src="config.js"></script>
<script>
(function(){
  "use strict";
  const supabase = window.supabase.createClient(window.SUPABASE_URL, window.SUPABASE_ANON_KEY);

  const EMAIL_DOMAIN = "@nationalmotors.co.kr";
  function buildEmail(localPart){
    const v = (localPart || "").trim();
    if(!v) return "";
    return v.includes("@") ? v : v + EMAIL_DOMAIN;
  }

  const msgEl = document.getElementById("msg");
  function showMsg(text, type){
    msgEl.textContent = text;
    msgEl.className = "msg " + (type || "error");
  }
  function clearMsg(){ msgEl.className = "msg"; msgEl.textContent = ""; }

  document.getElementById("to-signup").querySelector("a").addEventListener("click", ()=>{
    document.getElementById("login-form").hidden = true;
    document.getElementById("signup-form").hidden = false;
    document.getElementById("to-signup").hidden = true;
    document.getElementById("to-login").hidden = false;
    clearMsg();
  });
  document.getElementById("to-login").querySelector("a").addEventListener("click", ()=>{
    document.getElementById("login-form").hidden = false;
    document.getElementById("signup-form").hidden = true;
    document.getElementById("to-signup").hidden = false;
    document.getElementById("to-login").hidden = true;
    clearMsg();
  });

  document.getElementById("login-form").addEventListener("submit", async (e)=>{
    e.preventDefault();
    clearMsg();
    const email = buildEmail(document.getElementById("login-email").value);
    const password = document.getElementById("login-password").value;
    const btn = document.getElementById("login-btn");
    btn.disabled = true; btn.textContent = "로그인 중…";
    const { error } = await supabase.auth.signInWithPassword({ email, password });
    btn.disabled = false; btn.textContent = "로그인";
    if(error){ showMsg("로그인에 실패했습니다: " + error.message); return; }
    window.location.href = "dashboard.html";
  });

  document.getElementById("signup-form").addEventListener("submit", async (e)=>{
    e.preventDefault();
    clearMsg();
    const name = document.getElementById("signup-name").value.trim();
    const email = buildEmail(document.getElementById("signup-email").value);
    const password = document.getElementById("signup-password").value;
    const btn = document.getElementById("signup-btn");
    btn.disabled = true; btn.textContent = "가입 신청 중…";
    const { data, error } = await supabase.auth.signUp({ email, password });
    if(error){ btn.disabled = false; btn.textContent = "가입 신청"; showMsg("가입에 실패했습니다: " + error.message); return; }
    if(data.user){
      await supabase.from("profiles").insert({
        id: data.user.id, email, display_name: name, role: "pending"
      });
    }
    btn.disabled = false; btn.textContent = "가입 신청";
    showMsg("가입 신청이 접수되었습니다. 관리자 승인 후 로그인해 이용할 수 있습니다.", "ok");
  });

  // 이미 로그인되어 있으면 바로 대시보드로
  supabase.auth.getSession().then(({data})=>{
    if(data.session) window.location.href = "dashboard.html";
  });
})();
</script>
</body>
</html>
